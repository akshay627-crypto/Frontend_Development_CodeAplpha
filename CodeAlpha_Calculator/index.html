<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10110f">
  <meta name="description" content="A precise, keyboard-friendly calculator with a minimal dark interface and calculation history.">
  <title>Decimal — Calculator</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app-shell">
    <section class="calculator" aria-label="Calculator">
      <header class="topbar"><a class="brand" href="#">DECIMAL<span> / 01</span></a><span class="status"><i></i> READY</span></header>
      <div class="display-area">
        <p class="expression" id="expression" aria-live="polite">&nbsp;</p>
        <output class="display" id="display" aria-label="Calculator display" aria-live="polite" aria-atomic="true">0</output>
      </div>
      <div class="keypad" aria-label="Calculator keys">
        <button class="key key-utility" data-action="clear" type="button" aria-label="Clear all">AC</button>
        <button class="key key-utility" data-action="sign" type="button" aria-label="Change sign">±</button>
        <button class="key key-utility" data-action="percent" type="button" aria-label="Percent">%</button>
        <button class="key key-operator" data-operator="÷" type="button" aria-label="Divide">÷</button>
        <button class="key" data-digit="7" type="button">7</button><button class="key" data-digit="8" type="button">8</button><button class="key" data-digit="9" type="button">9</button><button class="key key-operator" data-operator="×" type="button" aria-label="Multiply">×</button>
        <button class="key" data-digit="4" type="button">4</button><button class="key" data-digit="5" type="button">5</button><button class="key" data-digit="6" type="button">6</button><button class="key key-operator" data-operator="−" type="button" aria-label="Subtract">−</button>
        <button class="key" data-digit="1" type="button">1</button><button class="key" data-digit="2" type="button">2</button><button class="key" data-digit="3" type="button">3</button><button class="key key-operator" data-operator="+" type="button" aria-label="Add">+</button>
        <button class="key key-zero" data-digit="0" type="button">0</button><button class="key" data-action="decimal" type="button" aria-label="Decimal point">.</button><button class="key key-equals" data-action="equals" type="button" aria-label="Equals">=</button>
      </div>
      <p class="key-hint">KEYBOARD READY <span>⌫ DELETE</span></p>
    </section>
    <aside class="history-panel" aria-labelledby="history-heading">
      <div class="history-heading"><div><p class="eyebrow">YOUR SESSION</p><h1 id="history-heading">History</h1></div><button class="clear-history" id="clear-history" type="button">Clear</button></div>
      <ol class="history-list" id="history-list" aria-live="polite"><li class="history-empty">Your calculations will appear here.</li></ol>
      <p class="history-footer">Results stay in this tab only.</p>
    </aside>
  </main>
</body>
</html>
